spring:
  application:
    name: ecom-application
  datasource:
    url: jdbc:postgresql://localhost:5432/ecomdb
    username: postgres
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgresSQLDialect

management:
  endpoints:
    web:
      exposure:
       include: health, info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true
info:
  app:
    name: MicroService
    description: App build my Me
    version: 1.0.0

server:
  shutdown: graceful